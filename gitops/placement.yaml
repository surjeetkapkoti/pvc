apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: all-envs
  namespace: openshift-gitops
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: env
              operator: In
              values:
                - dev
                - test
                - uat
                - sandbox
                - trng
                - preprod
                - prod


